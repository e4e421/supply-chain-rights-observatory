name: Report a public metadata correction
description: Request review of a public headline, record link, date or source classification.
title: "[Data review] "
body:
  - type: markdown
    attributes:
      value: |
        Link to the public record and original evidence supporting the proposed correction.
  - type: input
    id: record
    attributes:
      label: Public record_id (18 hex characters)
      placeholder: "Paste the public record ID"
    validations:
      required: true
  - type: input
    id: original
    attributes:
      label: Public original source URL
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What is incorrect and what independent public evidence supports a correction?
    validations:
      required: true
