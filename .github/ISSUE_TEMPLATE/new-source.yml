name: Propose a new reliable research source
description: Nominate an institution, dataset, journal or monitoring body for manual review; no automatic ingestion.
title: "[Source review] "
body:
  - type: markdown
    attributes:
      value: |
        Only public institutional information should be included. Never paste personal contact details, private documents, credentials, interviews or sensitive allegations.
        A reviewer must verify the source, access conditions and research utility before approval.
  - type: input
    id: institution
    attributes:
      label: Institution or dataset name
      placeholder: "e.g. official public regulator or academic data provider"
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Original HTTPS URL
      placeholder: "https://..."
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary evidence type
      options:
        - Official legislation or enforcement data
        - Official labour statistics
        - Academic metadata or peer-reviewed research
        - Civil society / worker organisation
        - Independent benchmark or company disclosures
        - News aggregator / discovery only
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Institutional mandate, research use and methodological limitations
      description: Explain legal status, publisher, methods, bias, geographic coverage and update frequency.
    validations:
      required: true
  - type: textarea
    id: licence
    attributes:
      label: Access rights and data licensing
      description: Provide source policy / API terms; do not assume that publication permits automated scraping.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety checklist
      options:
        - label: No personal data, private documents or API credentials are included in this issue.
          required: true
