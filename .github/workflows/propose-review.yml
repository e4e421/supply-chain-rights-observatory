name: Prepare Workbench review proposal
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Owner-authored Workbench review Issue number
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: scro-review-proposals
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.title == '[Workbench review batch]' &&
        github.event.issue.user.login == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Validate owner batch and create data-only proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/propose_reviews.py
