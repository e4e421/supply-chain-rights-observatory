name: Refresh public intelligence and deploy

on:
  schedule:
    # Daily 06:23 Asia/Taipei; GitHub scheduled runs can be delayed.
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'sources/**'
      - '.github/workflows/refresh-and-publish.yml'

permissions:
  contents: read

concurrency:
  group: supply-chain-observatory-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: true
      - name: Fetch public metadata
        run: python3 scripts/update_data.py
      - name: Validate public schema and URL allowlist
        run: python3 scripts/validate_data.py
      - name: Commit public data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/latest.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'data: refresh public research intelligence [skip ci]'
            git push origin HEAD:main
          fi

  deploy:
    needs: [collect]
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          ref: main
          persist-credentials: false
      - name: Validate public output
        run: python3 scripts/validate_data.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (Node.js 24)
      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (Node.js 24 dependencies)
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node.js 24)
      - name: Flag collection failure after displaying state on site
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/assert_health.py
