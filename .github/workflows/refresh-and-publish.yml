name: Refresh public intelligence and deploy

on:
  schedule:
    # 06:23 and 18:23 Taipei time
    - cron: '23 10,22 * * *'

    # Monday 06:43 Taipei time
    - cron: '43 22 * * 0'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy current review metadata without collecting news
        required: false
        type: boolean
        default: false
      review_revision:
        description: Committed revision requested by the review workflow
        type: string
        required: false
      publication_issue:
        description: Owner-authored review Issue to confirm after deployment
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'portal/**'
      - 'scripts/**'
      - 'sources/**'
      - 'data/**'
      - '.github/workflows/refresh-and-publish.yml'

permissions:
  contents: read

concurrency:
  group: supply-chain-observatory-main-writes
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.deploy_only) ||
      (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'Refresh public source feeds:') ||
       startsWith(github.event.head_commit.message, 'Check reference links:'))))
    # Pin runner to avoid the October-November 2026 ubuntu-latest transition to Ubuntu 26.04.
    # Reassess after validating collection and deployment on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CHECK_REFERENCE_LINKS_ONLY: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Check reference links:') }}
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.commit.outputs.release_sha }}
      collected: ${{ steps.commit.outputs.collected }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          ref: main
          persist-credentials: true
      - name: Fetch and archive public research metadata
        if: env.CHECK_REFERENCE_LINKS_ONLY != 'true'
        run: python3 scripts/update_data.py
      - name: Build monthly public search catalogue
        if: env.CHECK_REFERENCE_LINKS_ONLY != 'true'
        run: python3 scripts/build_catalog.py
      - name: Audit curated source registry
        run: |
          if [[ "${{ github.event_name }}" != schedule || "${{ github.event.schedule }}" == '43 22 * * 0' ]]; then
            python3 scripts/source_governance.py --online
          else
            python3 scripts/source_governance.py
          fi
      - name: Validate snapshot, archive, and source catalog
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_archive.py
          python3 -m unittest discover -s tests -v
          python3 scripts/evaluate_relevance.py
      - name: Commit public data only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/latest.json docs/data/archive-summary.json docs/data/source-health.json docs/data/archive data/archive data/candidates
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            if [[ "$CHECK_REFERENCE_LINKS_ONLY" == true ]]; then
              git commit -m 'data: refresh reference link availability [skip ci]'
            else
              git commit -m 'data: refresh public research intelligence [skip ci]'
            fi
            git push origin HEAD:main
          fi
          printf 'release_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$CHECK_REFERENCE_LINKS_ONLY" != true ]]; then
            printf 'collected=true\n' >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [collect]
    if: always() && github.ref == 'refs/heads/main' && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    # Pin runner to avoid the October-November 2026 ubuntu-latest transition to Ubuntu 26.04.
    # Reassess after validating collection and deployment on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve immutable deployment revision
        id: release
        env:
          COLLECTION_SHA: ${{ needs.collect.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          revision="$COLLECTION_SHA"
          if [[ -z "$revision" ]]; then
            revision="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release provenance
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          REVIEW_SHA: ${{ inputs.review_revision }}
          PUBLICATION_ISSUE: ${{ inputs.publication_issue }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [[ -n "$REVIEW_SHA" || -n "$PUBLICATION_ISSUE" ]]; then
            [[ "$REVIEW_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PUBLICATION_ISSUE" =~ ^[1-9][0-9]{0,9}$ ]]
            git merge-base --is-ancestor "$REVIEW_SHA" "$RELEASE_SHA"
          fi
          printf 'Release revision: %s\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify multilingual frontend and security contracts
        run: |
          node --check docs/i18n.js
          node --check docs/query.js
          node --test tests/test_query.mjs
          node --check docs/app.js
          node --check docs/archive.js
          node --check docs/record.js
          node --check docs/workbench/workbench.js
          node --check docs/relevance-client.js
          node --test tests/test_publication_index.mjs
          node --check docs/workbench/review-panel.js
          node --check docs/workbench/review-store.js
          node --test tests/test_review_store.mjs
          python3 -m unittest discover -s tests -v
      - name: Accessibility and frontend security regression checks
        run: |
          node --check docs/archive.js
          node --check docs/record.js
          python3 scripts/scan_frontend.py
          python3 scripts/check_accessibility.py
      - name: Browser smoke for visitor and workbench locales (when Chrome is available)
        run: |
          python3 scripts/browser_smoke.py
          python3 scripts/layout_regression.py
      - name: Validate public output and archive
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_archive.py
      - name: Build and validate generated multi-page index
        run: |
          node --check portal/portal.js
          python3 scripts/build_portal.py
          python3 scripts/build_relevance.py
          node --check _site/workbench/workbench.js
          node --check _site/portal.js
          python3 scripts/test_portal.py
          python3 scripts/test_portal_browser.py
          python3 scripts/test_review_browser.py
          python3 scripts/evaluate_relevance_v21.py
      - name: Retain public portal QA evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: portal-qa
          path: _qa/
          retention-days: 7
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (Node.js 24)
      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (Node.js 24 dependencies)
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node.js 24)
      - name: Confirm the public release and indexes
        run: python3 scripts/confirm_release.py
      - name: Flag collection failure after displaying state on site
        if: needs.collect.outputs.collected == 'true'
        run: python3 scripts/assert_health.py

  confirm_review:
    needs: [deploy]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_only && inputs.publication_issue != '' && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.deploy.outputs.release_sha }}
          persist-credentials: false
      - name: Confirm the deployed review batch and close its Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.deploy.outputs.release_sha }}
        run: python3 scripts/publish_reviews.py --finalize
