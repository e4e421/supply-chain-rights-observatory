name: Refresh public intelligence and deploy

on:
  schedule:
    # 06:23 and 18:23 Taipei time
    - cron: '23 10,22 * * *'

    # Monday 06:43 Taipei time
    - cron: '43 22 * * 0'
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy current review metadata without collecting news
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'portal/**'
      - 'scripts/**'
      - 'sources/**'
      - 'data/**'
      - '.github/workflows/refresh-and-publish.yml'

permissions:
  contents: read

concurrency:
  group: supply-chain-observatory-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.deploy_only)
    # Pin runner to avoid the October-November 2026 ubuntu-latest transition to Ubuntu 26.04.
    # Reassess after validating collection and deployment on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: true
      - name: Fetch and archive public research metadata
        run: python3 scripts/update_data.py
      - name: Build monthly public search catalogue
        run: python3 scripts/build_catalog.py
      - name: Audit curated source registry
        run: |
          if [[ "${{ github.event.schedule }}" == '43 22 * * 0' ]]; then
            python3 scripts/source_governance.py --online
          else
            python3 scripts/source_governance.py
          fi
      - name: Validate snapshot, archive, and source catalog
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_archive.py
          python3 -m unittest discover -s tests -v
          python3 scripts/evaluate_relevance.py
      - name: Commit public data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/latest.json docs/data/archive-summary.json docs/data/source-health.json docs/data/archive data/archive data/candidates
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'data: refresh public research intelligence [skip ci]'
            git push origin HEAD:main
          fi

  deploy:
    needs: [collect]
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    # Pin runner to avoid the October-November 2026 ubuntu-latest transition to Ubuntu 26.04.
    # Reassess after validating collection and deployment on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          ref: main
          persist-credentials: false
      - name: Verify multilingual frontend and security contracts
        run: |
          node --check docs/i18n.js
          node --check docs/query.js
          node --test tests/test_query.mjs
          node --check docs/app.js
          node --check docs/archive.js
          node --check docs/record.js
          node --check docs/workbench/workbench.js
          node --check docs/relevance-client.js
          node --check docs/workbench/review-panel.js
          python3 -m unittest discover -s tests -v
      - name: Accessibility and frontend security regression checks
        run: |
          node --check docs/archive.js
          node --check docs/record.js
          python3 scripts/scan_frontend.py
          python3 scripts/check_accessibility.py
      - name: Browser smoke for visitor and workbench locales (when Chrome is available)
        run: |
          python3 scripts/browser_smoke.py
          python3 scripts/layout_regression.py
      - name: Validate public output and archive
        run: |
          python3 scripts/validate_data.py
          python3 scripts/validate_archive.py
      - name: Build and validate generated multi-page index
        run: |
          node --check portal/portal.js
          python3 scripts/build_portal.py
          python3 scripts/build_relevance.py
          node --check _site/workbench/workbench.js
          node --check _site/portal.js
          python3 scripts/test_portal.py
          python3 scripts/test_portal_browser.py
          python3 scripts/test_review_browser.py
          python3 scripts/evaluate_relevance_v21.py
      - name: Retain public portal QA evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: portal-qa
          path: _qa/
          retention-days: 7
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (Node.js 24)
      - name: Upload static website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (Node.js 24 dependencies)
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (Node.js 24)
      - name: Flag collection failure after displaying state on site
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/assert_health.py
