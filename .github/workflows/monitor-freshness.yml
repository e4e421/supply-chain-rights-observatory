name: Monitor public collection freshness

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor-freshness.yml'
      - 'scripts/check_freshness.py'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Check the last successful collection
        run: python3 scripts/check_freshness.py
