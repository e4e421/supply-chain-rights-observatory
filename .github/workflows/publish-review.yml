name: Publish owner-confirmed public review
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing open owner-authored V2 publication Issue number
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: scro-owner-review-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.title == '[Publish Workbench review]' &&
        github.event.issue.user.login == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate source and publishing code
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/validate_data.py
          python3 scripts/validate_archive.py
      - name: Validate owner confirmation, preview, publish and dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_reviews.py
