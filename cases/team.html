<div class="hero"><h1>研究後台 <small lang="en">Research desk</small></h1>
<p>研究團隊可檢索線索、記錄變更及審閱案件。編審核准的公開內容會在下次成功發布後出現在案件頁。</p></div>
<p id="status" role="status" aria-live="polite">讀取專案設定中…</p>
<form id="login" class="panel" hidden><label>研究帳號 Email <input name="email" type="email" autocomplete="username" required></label>
<label>密碼 Password <input name="password" type="password" autocomplete="current-password" required></label><button>登入 Sign in</button></form>
<section id="desk" hidden><div class="controls"><button id="logout">登出</button><label>案件 <select id="case-select"></select></label><button id="new-case">新增案件</button></div>
<h2>案件草稿</h2><form id="draft" class="panel"><label>案件 ID <input id="case-id" pattern="[a-z][a-z0-9-]{1,70}" required></label>
<label>中文案名 <input id="title-zh" required></label><label>English title <input id="title-en" required></label>
<label>追蹤類別 <select id="gap"><option value="response">待回應</option><option value="procedure">待查程序</option><option value="remedy">待補救證據</option><option value="voice">待權利人觀點</option></select></label>
<label>下次查核 <input id="due" type="date"></label><label>追蹤負責人（內部）<input id="owner" maxlength="120"></label>
<label>內部筆記 <textarea id="note" rows="2" maxlength="8000"></textarea></label>
<details><summary>完整公開草稿，可編輯所有欄位與更正時間線</summary>
<label>案件資料 JSON <textarea id="payload" rows="14" spellcheck="false"></textarea></label></details>
<details id="entry"><summary>新增一筆有來源的進展</summary>
<label>行動者 <input id="actor"></label><label>類型 <select id="kind"><option value="report">報導或指控</option><option value="response">回應</option><option value="no_response">來源記錄未回應</option><option value="procedure">程序</option><option value="commitment">承諾</option><option value="worker_voice">權利人觀點</option><option value="remedy">補救</option><option value="correction">更正</option></select></label>
<label>事件日（未知可留白）<input type="date" id="entry-date"></label><label>來源日期 <input type="date" id="source-date"></label>
<label>來源發布者 <input id="publisher"></label><label>原始來源網址 <input type="url" id="source-url"></label>
<label>中文進展 <textarea id="entry-zh"></textarea></label><label>English development <textarea id="entry-en"></textarea></label><button type="button" id="append">加入目前草稿</button></details>
<button type="submit">儲存私有草稿</button></form>
<section id="editor" hidden><h2>發布審核</h2><div class="controls"><button id="preview">核對公開內容</button><button id="approve" disabled>核准本版</button><button id="withdraw">撤回案件公開版</button></div><pre class="notes" id="review"></pre></section>
<h2>研究佇列</h2><div class="controls"><label>資料類型 <select id="pool"><option value="researchRecords">出版紀錄</option><option value="researchCandidates">候選線索</option><option value="caseLeads">案件監測新線索</option><option value="caseChecks">來源回查狀態</option><option value="sourceChanges">原頁變更待查</option><option value="caseSuggestions">LLM 草稿待查</option><option value="researchReviews">歷次出版審核</option></select></label>
<label>篩選已載入資料 <input type="search" id="find"></label><button id="more">載入下一頁</button></div><p id="loaded"></p><ul id="rows"></ul></section>
